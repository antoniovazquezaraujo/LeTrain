name: Java CI with Maven

on:
  push:
    branches: [ "develop", "main" ]
  pull_request:
    branches: [ "develop", "main" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v5
    
    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven
        
    - name: Check the class index is up to date
      run: |
        java tools/GenClassIndex.java
        git diff --exit-code -- docs/developer/architecture/ClassIndex.md

    - name: Check formatting (Spotless)
      run: mvn spotless:check

    - name: Build and run tests
      run: xvfb-run mvn test
