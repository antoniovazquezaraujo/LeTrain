name: Build Snap Package

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        
      - name: Build Snap
        uses: snapcore/action-build@v1
        id: build
        
      - name: Upload Snap artifact
        uses: actions/upload-artifact@v3
        with:
          name: letrain-snap
          path: ${{ steps.build.outputs.snap }}
