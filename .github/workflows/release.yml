name: Build and Release

on:
  push:
    tags:
      - 'v*' # Trigger release when a tag starting with "v" (e.g. v1.0.0) is pushed

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: LeTrain-Linux.zip
          - os: windows-latest
            artifact_name: LeTrain-Windows.zip

    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'
          cache-dependency-path: 'pom.xml'

      - name: Build with Maven
        run: mvn package -DskipTests

      - name: Compress Linux Output
        if: matrix.os == 'ubuntu-latest'
        run: |
          cd output
          zip -r ../${{ matrix.artifact_name }} *
        
      - name: Compress Windows Output
        if: matrix.os == 'windows-latest'
        run: |
          Compress-Archive -Path output\* -DestinationPath ${{ matrix.artifact_name }}

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: ${{ matrix.artifact_name }}
          generate_release_notes: true

      - name: Publish to itch.io (Linux)
        if: startsWith(github.ref, 'refs/tags/') && matrix.os == 'ubuntu-latest'
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
        run: |
          curl -L -o butler.zip https://github.com/itchio/butler/releases/latest/download/butler-linux-amd64.zip
          unzip butler.zip
          chmod +x linux-amd64/butler
          ./linux-amd64/butler push ${{ matrix.artifact_name }} avaraujo/letrain-procedural-tycoon:linux --userversion ${{ github.ref_name }}
        
      - name: Publish to itch.io (Windows)
        if: startsWith(github.ref, 'refs/tags/') && matrix.os == 'windows-latest'
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
        run: |
          Invoke-WebRequest -Uri "https://github.com/itchio/butler/releases/latest/download/butler-windows-amd64.zip" -OutFile "butler.zip"
          Expand-Archive -Path "butler.zip" -DestinationPath "."
          .\windows-amd64\butler.exe push ${{ matrix.artifact_name }} avaraujo/letrain-procedural-tycoon:windows --userversion ${{ github.ref_name }}

