name: Feature request
description: Suggest an idea or an improvement
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the suggestion! Tell us what problem it solves.
  - type: textarea
    id: problem
    attributes:
      label: What problem does it solve?
      description: The need or frustration behind the request.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered (optional)
    validations:
      required: false
  - type: textarea
    id: context
    attributes:
      label: Extra context (optional)
      description: Screenshots, mockups, related issues...
    validations:
      required: false
