name: Bug report
description: Something is not working as expected
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Please fill in as much as you can.
  - type: input
    id: version
    attributes:
      label: Version
      description: Release tag (see the window title or the Releases page) or commit.
      placeholder: "v1.0.0-beta.4"
    validations:
      required: true
  - type: dropdown
    id: client
    attributes:
      label: Client
      options:
        - 2D terminal (LeTrain2D)
        - 3D (LeTrain)
        - letrain-check (CLI)
        - Other / not sure
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: "Windows 11 / Ubuntu 24.04 / macOS 14"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs, screenshots or scenario file (optional)
      description: Paste logs or drag screenshots here. If it is scenario related, attach the `.ltr` file.
    validations:
      required: false
