# Cargo Base Values (Revenue per unit)
cargo.GOLD=2000.0
cargo.COAL=200.0
cargo.RUBY=20000.0

# Cargo Probabilities (Thresholds)
# Smaller values = MORE abundance. Default is 0.28.
# (0.1 = Very common, 0.5 = Very rare)
threshold.RUBY=0.35
threshold.GOLD=0.30
threshold.COAL=0.25

# Terrain Generation (Relief)
# Values from 0 to 255. 
# WATER: Lower values = less water. Default 130.
# ROCK: Higher values = less mountains. Default 180.
threshold.WATER=130
threshold.ROCK=180

# Initial Map Generation (View Radius)
# Radius from cursor. Default is 5 (covers 11x11 block). 10 covers 21x21.
# Large values may slow down initial world generation.
map.VIEW_RADIUS=15

# Construction Delays (in ticks)
delay.NORMAL_TRACK=0
delay.BRIDGE_TRACK=20
delay.BRIDGE_GATE_TRACK=20
delay.TUNNEL_TRACK=0
delay.TUNNEL_GATE_TRACK=50
